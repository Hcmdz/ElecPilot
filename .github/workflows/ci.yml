name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v4.4.2

      - name: Configure Gradle JVM memory
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon.idletimeout=600000
          EOF

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

  secret-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        # v3 never reads GITLEAKS_CONFIG and never passes --config: the action
        # invokes `gitleaks` with its own flags, so the ruleset here is the
        # built-in one. The line that used to name .gitleaks.toml was read by no
        # version of this action and left a setting that looked live and did
        # nothing. That file stays a LOCAL gate -- its own header says so, and
        # it covers rules (generic passwords, google_api_key, firebase keys)
        # that this scan does not. If the repo ever wants these rules in CI,
        # the action has to grow a config input or the step has to call the
        # gitleaks CLI directly; do not reintroduce the env var expecting it to
        # work.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No sensitive filenames tracked
        run: |
          # The list is the same file the generic gate and the audit engine read,
          # so the verdict and this gate cannot disagree about a sensitive path.
          NAMES=$(grep -v '^#' .github/sensitive-filenames.txt | grep -v '^$' | paste -sd'|')
          test -n "$NAMES"
          ! git ls-files \
            | grep -iE "$NAMES" \
            | grep -q .
          echo "filenames clean"
