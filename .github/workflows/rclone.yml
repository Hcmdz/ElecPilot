name: rclone bump

# Monthly check for a new rclone release (plus manual dispatch). Builds the
# trimmed librclone.so via tools/rclone/build-librclone.sh and opens ONE PR
# per version. Never pushes to main: every bump needs the device OAuth gate
# (Drive + OneDrive) described in tools/rclone/contract.md before merge.

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'rclone tag to build (default: latest release)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      wanted: ${{ steps.v.outputs.wanted }}
      pinned: ${{ steps.v.outputs.pinned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # this job only reads a pin file and queries a release; it never
          # pushes, so the checkout keeps no credential on disk
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned="$(tr -d '[:space:]' < tools/rclone/pinned-version.txt)"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [[ -n "${{ inputs.version }}" ]]; then
            wanted="${{ inputs.version }}"
          else
            wanted="$(gh release view --repo rclone/rclone --json tagName -q .tagName)"
          fi
          if [[ "$pinned" == "$wanted" ]]; then wanted=""; fi
          echo "wanted=$wanted" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.wanted != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read toolchain pins
        id: pins
        run: |
          set -a; source tools/rclone/toolchain.lock; set +a
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "ndk=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "upx=$UPX_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.pins.outputs.go }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${{ steps.pins.outputs.ndk }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ steps.pins.outputs.ndk }}" >> "$GITHUB_ENV"

      - name: Install UPX
        run: |
          curl -fsSL -o /tmp/upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v${{ steps.pins.outputs.upx }}/upx-${{ steps.pins.outputs.upx }}-amd64_linux.tar.xz"
          tar -xf /tmp/upx.tar.xz -C /tmp
          echo "/tmp/upx-${{ steps.pins.outputs.upx }}-amd64_linux" >> "$GITHUB_PATH"
          upx --version | head -1 | grep -q "${{ steps.pins.outputs.upx }}" || exit 1

      - name: Build trimmed librclone.so
        run: ./tools/rclone/build-librclone.sh --version "${{ needs.check.outputs.wanted }}"

      - name: Size gate
        run: |
          arm=$(stat -c %s app/src/main/jniLibs/arm64-v8a/librclone.so)
          base=$(grep -oP '^arm64-v8a/librclone.so bytes=\K[0-9]+' tools/rclone/size-baseline.txt)
          max=$(( base + base / 10 ))
          echo "arm64=$arm baseline=$base max=$max"
          [[ "$arm" -le "$max" ]] || { echo "SIZE GATE FAIL"; exit 1; }

      - name: Close superseded bump PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --label rclone-bump --state open \
            --json number -q '.[].number' | xargs -r -n1 \
            gh pr close --repo "$GITHUB_REPOSITORY" --comment "Superseded by a newer rclone bump."

      - name: Open bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          w="${{ needs.check.outputs.wanted }}"
          git checkout -b "rclone/bump-$w"
          git add app/src/main/jniLibs tools/rclone/pinned-version.txt THIRD_PARTY.md
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: bump trimmed rclone to $w"
          git push -u origin "rclone/bump-$w"
          gh pr create --repo "$GITHUB_REPOSITORY" --title "rclone: bump to $w — needs OAuth device test" \
            --label rclone-bump --body "$(cat <<EOF
          Trimmed rebuild (\`local,drive,onedrive\` + contract commands) of rclone \`$w\`.
          Contract: \`tools/rclone/contract.md\`.

          Merge checklist:
          - [ ] CI smoke test green (backends, lsf flags, copyto round trip)
          - [ ] Size gate green (arm64 +10% max vs baseline)
          - [ ] Device test: OAuth + list/upload/download/delete on Drive
          - [ ] Device test: OAuth + list/upload/download/delete on OneDrive
          - [ ] Old encrypted config loads in new binary (forward-compat)
          EOF
          )"
