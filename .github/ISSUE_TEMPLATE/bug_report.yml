name: Bug Report
description: Report a bug in ElecPilot
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      description: "e.g. 6.1"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Pixel 7
        - Samsung Galaxy S23
        - Other Android device
    validations:
      required: true
